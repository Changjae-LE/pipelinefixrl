name: e2e

# Full regression: A1-A14 base pipeline + scenario-001..010 (broken/golden/
# compose) + baseline + advanced repair agents. This drives the EXISTING make
# targets, not a second validation path.
#
# Manual trigger only. NOT scheduled: the harness is validated on a Windows
# host; its behaviour on Linux CI runners has not yet been confirmed, so a cron
# job would produce noisy false failures. Enable the schedule below only after
# a green manual run. No secrets required.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * *"   # enable once a manual run on Linux is green

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: base pipeline (A1-A14)
        run: make e2e-base

      - name: scenario-001..010 (broken / golden / compose)
        run: |
          for n in 001 002 003 004 005 006 007 008 009 010; do
            make "scenario-$n"
          done

      - name: baseline + advanced repair agents (001..010 matrix)
        run: make agents-matrix

      - name: teardown
        if: always()
        run: make kind-down || true
