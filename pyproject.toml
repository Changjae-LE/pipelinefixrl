[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelinefixrl"
version = "0.1.0"
description = "Reproducible kind-based CI/CD and Kubernetes repair environment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
]

[tool.setuptools]
packages = ["app", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
