id: scenario-007
title: Misconfigured ConfigMap reference
category: configuration/kubernetes-configmap
difficulty: medium
description: >
  charts/app/values.yaml sets config.key to "teir" instead of "tier". The
  container's env var APP_TIER is sourced via configMapKeyRef with
  key: {{ .Values.config.key }}, so it now references a key that does not exist
  in the app-config ConfigMap. The kubelet cannot create the container
  (CreateContainerConfigError) and the pod never starts, so every functional
  check fails; only the Helm release install succeeds.
target:
  chart: charts/app
  namespace_prefix: pfrl-scenario-007
patches:
  break: break.patch
  golden: golden.patch
evaluation:
  deploy_timeout_seconds: 45
  restart_threshold: 0

  # functional backbone reduced to 85, config_applied adds 15 -> total 100.
  checks: [config_applied]
  weights:
    rollout_complete: 15
    deployment_ready: 15
    pods_ready: 10
    config_applied: 15

  # additive to the base anti-cheat (PROJECT_SPEC 7.2). Blocks "fixing" the pod
  # by severing the config dependency: the configMapKeyRef env must stay, the
  # app-config ConfigMap must stay templated from values with non-empty data,
  # and app/main.py must still read APP_TIER from the environment.
  anticheat:
    config_wiring_intact: true

  expect:
    broken:
      score_max: 10
      must_pass:
        - helm_release_ok
      must_fail:
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - config_applied
      evidence:
        events_contains:
          - "couldn't find key"
          - "app-config"
        pods_json_contains:
          - "CreateContainerConfigError"
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - config_applied
      anticheat_clean: true
