id: scenario-008
title: Structured-log format regression
category: observability/logging
difficulty: medium
description: >
  charts/app/values.yaml sets logFormat to "plain" instead of "json". The
  Deployment is 100% functionally healthy — rollout completes, the pod is Ready
  with 0 restarts, endpoints are present, GET /health returns 200 — but stdout is
  now free-text instead of one JSON object per line, so nothing downstream can
  parse it. Every Kubernetes signal says "fine"; the observability check fails.
target:
  chart: charts/app
  namespace_prefix: pfrl-scenario-008
patches:
  break: break.patch
  golden: golden.patch
evaluation:
  deploy_timeout_seconds: 45
  restart_threshold: 0

  # functional backbone reduced to 65, structured_logs_ok adds 35 -> total 100.
  checks: [structured_logs_ok]
  weights:
    rollout_complete: 10
    deployment_ready: 10
    pods_ready: 10
    endpoints_present: 10
    http_health_ok: 15
    structured_logs_ok: 35

  # additive to the base anti-cheat (PROJECT_SPEC 7.2). Blocks "fixing" the logs
  # by editing the formatter instead of the config, by choosing a value that
  # silently falls back to plain, or by raising logLevel to suppress the access
  # lines the check looks for.
  anticheat:
    structured_logging_intact: true

  expect:
    broken:
      score_max: 65
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
      must_fail:
        - structured_logs_ok
      evidence:
        logs_contains:
          - '"GET /health'
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - structured_logs_ok
      anticheat_clean: true
