id: scenario-001
title: Incorrect readiness probe path
category: kubernetes/probes
difficulty: intro
description: >
  The readiness probe points at a path the application does not serve
  (/health2 instead of /health), so every pod fails its readiness check with
  HTTP 404, never becomes Ready, the Deployment rollout never completes, and the
  Service ends up with no ready endpoints. The liveness probe is unaffected, so
  pods are not restarted — they simply stay un-Ready.

target:
  chart: charts/app
  namespace_prefix: pfrl-scenario-001

patches:
  break: break.patch
  golden: golden.patch

evaluation:
  deploy_timeout_seconds: 60
  restart_threshold: 0
  expect:
    broken:
      score_max: 60
      must_pass:
        - helm_release_ok
      must_fail:
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
      evidence:
        events_contains:
          - "Unhealthy"
          - "404"
        logs_contains:
          - "/health2"
          - "404"
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
      anticheat_clean: true
