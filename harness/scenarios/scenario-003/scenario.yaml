id: scenario-003
title: OOMKilled crash loop
category: runtime/resources
difficulty: easy-medium
description: >
  charts/app/values.yaml sets resources.requests.memory and
  resources.limits.memory both to 16Mi. The Python/uvicorn process exceeds the
  cgroup memory limit during import and is OOM-killed (SIGKILL, exit 137) on
  every start, so the pod never reaches Ready and cycles
  Running -> OOMKilled -> CrashLoopBackOff with RESTARTS climbing. The probes
  are irrelevant here — the container dies before it can serve. Setting both
  requests and limits keeps the manifest valid (requests <= limits).

target:
  chart: charts/app
  namespace_prefix: pfrl-scenario-003

patches:
  break: break.patch
  golden: golden.patch

evaluation:
  deploy_timeout_seconds: 60
  restart_threshold: 0

  # activate the scenario-specific scored check and reallocate backbone weight
  # so the total is still 100 (helm 10 / rollout 15 / deployment_ready 15 /
  # pods_ready 15 / endpoints 15 / http 20 / no_oomkill 10).
  checks: [no_oomkill]
  weights:
    rollout_complete: 15
    deployment_ready: 15
    no_oomkill: 10

  # additive to the base anti-cheat (PROJECT_SPEC 7.2). Blocks "fixing" the pod
  # by deleting resource governance or setting a still-too-low value: the
  # requests/limits blocks must remain present and non-empty with a memory
  # floor.
  anticheat:
    min_memory:
      requests: 32Mi
      limits: 64Mi

  expect:
    broken:
      score_max: 10
      must_pass: [helm_release_ok]
      must_fail:
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - no_oomkill
      evidence:
        pods_json_contains:
          - "OOMKilled"
          - "137"
        events_contains:
          - "BackOff"
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - no_oomkill
      anticheat_clean: true
