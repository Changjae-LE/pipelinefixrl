id: scenario-009
title: CI gate + health-contract regression
category: cicd/testing
difficulty: hard
description: >
  app/main.py's /health handler returns {"status": "healthy"} instead of
  {"status": "ok"}. The readiness probe only checks the status code, so the pod
  still goes Ready — but pytest (tests/test_health.py::test_health_returns_ok)
  fails, scripts/ci.sh goes red, and the harness's http_health_ok (which asserts
  the exact body) fails. "The pod is Ready" is not enough: the /health contract
  and the CI gate are part of done.
target:
  chart: charts/app
  namespace_prefix: pfrl-scenario-009
patches:
  break: break.patch
  golden: golden.patch
evaluation:
  deploy_timeout_seconds: 60
  restart_threshold: 0

  # functional backbone reduced to 70, ci_gate_pass adds 30 -> total 100.
  checks: [ci_gate_pass]
  weights:
    rollout_complete: 10
    deployment_ready: 10
    pods_ready: 10
    endpoints_present: 10
    ci_gate_pass: 30

  # additive to the base anti-cheat (PROJECT_SPEC 7.2). Blocks "fixing" CI by
  # editing or deleting a test, and requires the /health contract + a valid
  # chart version to remain intact.
  anticheat:
    ci_contract_intact: true

  expect:
    broken:
      score_max: 50
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
      must_fail:
        - ci_gate_pass
        - http_health_ok
      evidence:
        ci_log_contains:
          - "FAILED"
          - "test_health_returns_ok"
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - ci_gate_pass
      anticheat_clean: true
