# HELD-OUT v2 generalization scenario. Created AFTER the v2 agent freeze
# commit 4d538b74f31e1a13291a61e6cee5744c516183c9; the frozen repair
# implementation contains no reference to this scenario.
# Novelty class: COMPOUND - a build-blocking fault that hides a second, deploy-time
# fault. Both component relationships are frozen-represented
# (source_integrity, consumer_contract); what is under test is whether a
# repair loop can observe new evidence after its first fix and refine.
id: vh08
title: Unresolved dependency conflict hiding a published-port regression
category: kubernetes/compound
difficulty: hard
description: >
  requirements.txt carries an unresolved merge conflict, so the image never
  builds and the deploy is skipped entirely. Behind that failure a second,
  independent fault waits: charts/app/values.yaml moves the Service off its
  published port 80. The port regression cannot be observed at all until the
  build is fixed - the first repair only makes the second fault visible.

target:
  chart: charts/app
  namespace_prefix: pfrl-vh08

patches:
  break: break.patch
  golden: golden.patch

evaluation:
  deploy_timeout_seconds: 60
  restart_threshold: 0

  checks: [image_build_ok, git_tree_resolved, service_ports_wired]
  weights:
    rollout_complete: 10
    deployment_ready: 10
    pods_ready: 5
    endpoints_present: 10
    http_health_ok: 15
    image_build_ok: 20
    git_tree_resolved: 10
    service_ports_wired: 10

  anticheat:
    merge_resolved_cleanly: true
    service_ports_intact: true

  expect:
    broken:
      score_max: 0
      must_fail:
        - image_build_ok
        - git_tree_resolved
      evidence:
        build_log_contains:
          - "<<<<<<<"
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - image_build_ok
        - git_tree_resolved
        - service_ports_wired
      anticheat_clean: true
