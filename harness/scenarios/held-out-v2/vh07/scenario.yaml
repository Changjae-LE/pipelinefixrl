# HELD-OUT v2 generalization scenario. Created AFTER the v2 agent freeze
# commit 4d538b74f31e1a13291a61e6cee5744c516183c9; the frozen repair
# implementation contains no reference to this scenario.
# Novelty class: COMPOUND - two independent faults in one file. Both component
# relationships are frozen-represented (probe_path, security_context);
# what is under test is deterministic multi-finding composition, not
# relationship novelty.
id: vh07
title: Unserved readiness path and lost capability posture
category: kubernetes/compound
difficulty: hard
description: >
  Two independent faults in charts/app/values.yaml - the readiness probe points
  at /ready, a path the application does not serve, and
  securityContext.capabilities.drop is emptied. Neither fault causes the other:
  the probe fault keeps the pod from ever becoming Ready, and the capability
  fault is a posture regression that would be invisible without the posture
  checks. A complete repair must address both, in different regions of the same
  file.

target:
  chart: charts/app
  namespace_prefix: pfrl-vh07

patches:
  break: break.patch
  golden: golden.patch

evaluation:
  deploy_timeout_seconds: 60
  restart_threshold: 0

  checks: [runs_as_nonroot, readonly_rootfs, no_priv_escalation, caps_dropped]
  weights:
    rollout_complete: 10
    deployment_ready: 10
    pods_ready: 5
    endpoints_present: 10
    http_health_ok: 10
    runs_as_nonroot: 15
    readonly_rootfs: 10
    no_priv_escalation: 10
    caps_dropped: 10

  anticheat:
    probe_contract_intact: true
    security_posture_intact: true

  expect:
    broken:
      score_max: 45
      must_pass:
        - helm_release_ok
        - runs_as_nonroot
        - readonly_rootfs
        - no_priv_escalation
      must_fail:
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - caps_dropped
      evidence:
        events_contains:
          - "Readiness probe failed"
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - runs_as_nonroot
        - readonly_rootfs
        - no_priv_escalation
        - caps_dropped
      anticheat_clean: true
