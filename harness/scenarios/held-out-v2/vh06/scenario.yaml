# HELD-OUT v2 generalization scenario. Created AFTER the v2 agent freeze
# commit 4d538b74f31e1a13291a61e6cee5744c516183c9; the frozen repair
# implementation contains no reference to this scenario.
# Novelty class: B - a GENUINELY NOVEL relationship: no frozen primitive reasons about
# workload replica capacity. The rollout also reports success vacuously,
# so the fault hides behind a green rollout.
id: vh06
title: Workload scaled to zero
category: kubernetes/workload
difficulty: hard
description: >
  charts/app/values.yaml sets replicaCount to 0. Helm installs cleanly and
  `kubectl rollout status` reports success immediately - a Deployment with zero
  desired replicas is trivially "complete" - but no pod is ever created, the
  Service has no endpoints and nothing serves traffic.

target:
  chart: charts/app
  namespace_prefix: pfrl-vh06

patches:
  break: break.patch
  golden: golden.patch

evaluation:
  deploy_timeout_seconds: 45
  restart_threshold: 0

  checks: [workload_capacity]
  weights:
    rollout_complete: 15
    deployment_ready: 15
    pods_ready: 15
    endpoints_present: 15
    http_health_ok: 20
    workload_capacity: 10

  anticheat:
    min_replicas: 1

  expect:
    broken:
      score_max: 45
      must_pass: [helm_release_ok]
      must_fail:
        - pods_ready
        - endpoints_present
        - http_health_ok
        - workload_capacity
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - workload_capacity
      anticheat_clean: true
