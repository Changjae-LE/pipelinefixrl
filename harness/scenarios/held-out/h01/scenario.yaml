# HELD-OUT generalization scenario (Improvement 2). Created AFTER the agent
# freeze commit 8ccbe0d62df1c336e2384d45486db52194630892; the frozen repair
# implementation contains no reference to this scenario.
# Novelty class: A — a held-out INSTANCE of a general relationship the frozen
# service_wiring primitive already represents (targetPort <-> containerPort).
id: h01
title: Service targetPort does not reach the container
category: kubernetes/networking
difficulty: medium
description: >
  charts/app/values.yaml points service.targetPort at 9090 while the container
  listens on containerPort 8000. The selector is correct, the pod is Running
  and Ready (probes hit the container port directly), and the EndpointSlice
  lists a ready endpoint — but every connection through the Service is
  forwarded to a port nothing listens on, so traffic to the application dies.

target:
  chart: charts/app
  namespace_prefix: pfrl-h01

patches:
  break: break.patch
  golden: golden.patch

evaluation:
  deploy_timeout_seconds: 45
  restart_threshold: 0

  # activate the generic port-relationship check and reallocate backbone weight
  # so the total stays 100 (helm 10 / rollout 15 / deployment_ready 15 /
  # pods_ready 10 / endpoints 15 / http 20 / service_ports_wired 15).
  checks: [service_ports_wired]
  weights:
    rollout_complete: 15
    deployment_ready: 15
    pods_ready: 10
    service_ports_wired: 15

  # additive to the base anti-cheat (PROJECT_SPEC 7.2). service_wiring_intact
  # blocks selector-side evasion; service_ports_intact keeps the chart's port
  # relationships coherent (published service port, targetPort==containerPort,
  # probe ports on the container port).
  anticheat:
    service_wiring_intact: true
    service_ports_intact: true

  expect:
    broken:
      score_max: 65
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
      must_fail:
        - http_health_ok
        - service_ports_wired
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - service_ports_wired
      anticheat_clean: true
