id: scenario-010
title: Unresolved merge conflict
category: git/build
difficulty: medium
description: >
  requirements.txt still carries an unresolved Git merge conflict — the raw
  conflict marker lines were committed. `pip install -r requirements.txt` inside
  the Docker build chokes on those lines, so `docker build` exits non-zero, the
  image is never produced, and nothing is deployed. The fix is to finish the
  merge: resolve requirements.txt to a valid dependency list with no markers.
target:
  chart: charts/app
  namespace_prefix: pfrl-scenario-010
patches:
  break: break.patch
  golden: golden.patch
evaluation:
  deploy_timeout_seconds: 60
  restart_threshold: 0

  # No functional backbone runs for the broken variant (build fails, deploy is
  # skipped). Golden builds + deploys: backbone 70 + image_build_ok 20 +
  # git_tree_resolved 10 = 100.
  checks: [image_build_ok, git_tree_resolved]
  weights:
    rollout_complete: 10
    deployment_ready: 10
    pods_ready: 10
    endpoints_present: 10
    image_build_ok: 20
    git_tree_resolved: 10

  # additive to the base anti-cheat (PROJECT_SPEC 7.2). Blocks "resolving" the
  # conflict by gutting the dependency list or bypassing pip in the Dockerfile.
  anticheat:
    merge_resolved_cleanly: true

  expect:
    broken:
      score_max: 10
      must_fail:
        - image_build_ok
        - git_tree_resolved
      evidence:
        build_log_contains:
          - "<<<<<<<"
    golden:
      score_min: 100
      must_pass:
        - helm_release_ok
        - rollout_complete
        - deployment_ready
        - pods_ready
        - endpoints_present
        - http_health_ok
        - image_build_ok
        - git_tree_resolved
      anticheat_clean: true
